<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14212f">
<title>TRANSPORT SMJ — Pengajuan Uang Jalan & Operasional Armada</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700;800&family=Barlow+Condensed:wght@500;600;700;800&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@0.294.0/dist/umd/lucide.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
:root{
  --navy:#14212f;--ink:#1c2530;--paper:#f4f3ee;--card:#ffffff;
  --line:#e5e3da;--line2:#c9c6ba;--muted:#67717e;
  --blue:#1b5cb8;--green:#1a7a4a;--purple:#6a41b8;--orange:#c96a08;--wine:#8f2333;
  --uj:#1b5cb8;--ub:#1a7a4a;--parkir:#a16207;--standby:#6a41b8;--tambahan:#d9480f;--kbm:#0e7490;
  --amber:#f0a202;--radius:14px;
  --shadow:0 1px 2px rgba(20,25,35,.05),0 4px 16px rgba(20,25,35,.07);
}
html{-webkit-text-size-adjust:100%}
body{font-family:'Barlow',sans-serif;background:var(--paper);color:var(--ink);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer}
input,select{font-family:inherit}
svg.lucide{width:18px;height:18px;flex:none;vertical-align:-3px}
b,strong{font-weight:700}
.app{display:flex;min-height:100vh}
.login-wrap{max-width:430px;margin:26px auto 60px;padding:0 14px}
.login-card{background:#fff;border:1.5px solid var(--line2);border-radius:18px;box-shadow:var(--shadow);overflow:hidden}
.login-hero{background:var(--navy);color:#fff;text-align:center;padding:22px 18px 18px}
.login-hero .rc-badge{margin-bottom:6px}
.login-hero h2{font-family:'Barlow Condensed';font-size:24px;font-weight:800;letter-spacing:1.4px}
.login-hero p{font-size:9.5px;font-weight:800;letter-spacing:3px;color:var(--amber);margin-top:2px}
.login-tabs{display:flex;border-bottom:1.5px solid var(--line)}
.login-tabs button{flex:1;border:0;background:transparent;padding:13px 4px;font-weight:800;font-size:12px;letter-spacing:1px;color:var(--muted);border-bottom:3px solid transparent}
.login-tabs button.on{color:var(--ink);border-bottom-color:var(--amber);background:#fbfaf6}
.login-body{padding:18px 16px}
.login-note{margin-top:14px;font-size:11.5px;color:var(--muted);text-align:center;line-height:1.5}
.diag-link{display:block;margin:12px auto 0;background:none;border:0;color:var(--blue);font-size:11.5px;font-weight:800;letter-spacing:.5px}
.sidebar{position:fixed;top:0;bottom:0;left:0;width:268px;background:var(--navy);color:#dfe6ef;z-index:60;display:flex;flex-direction:column;transform:translateX(-105%);transition:transform .28s ease}
.sidebar.open{transform:none;box-shadow:0 0 60px rgba(0,0,0,.45)}
.overlay{position:fixed;inset:0;background:rgba(10,15,22,.5);opacity:0;pointer-events:none;transition:.25s;z-index:55}
.overlay.show{opacity:1;pointer-events:auto}
.sb-head{padding:18px 16px 14px;border-bottom:1px solid rgba(255,255,255,.09);display:flex;align-items:center;gap:12px}
.plate{background:#fff;border:2px solid #0b1016;border-radius:6px;padding:3px 8px 2px;text-align:center;line-height:1}
.plate b{display:block;font-family:'Barlow Condensed';font-weight:800;font-size:21px;color:var(--navy);letter-spacing:1px}
.plate small{display:block;font-size:6.5px;font-weight:800;letter-spacing:2px;color:#8a94a3;margin-top:1px}
.sb-t b{display:block;font-size:15px;letter-spacing:.6px;color:#fff}
.sb-t small{display:block;font-size:9.5px;font-weight:800;letter-spacing:2.4px;color:var(--amber);margin-top:2px}
.sb-t em{display:block;font-style:normal;font-size:9px;letter-spacing:1.2px;color:#8fa0b5;margin-top:3px}
.sb-nav{padding:10px 0;flex:1;overflow:auto}
.sb-cap{font-size:9.5px;font-weight:800;letter-spacing:2px;color:#64768c;padding:10px 18px 6px}
.nav-it{display:flex;align-items:center;gap:12px;width:100%;padding:13px 16px;background:transparent;border:0;border-left:3px solid transparent;color:#a9b5c5;font-weight:700;font-size:12.5px;letter-spacing:.8px;text-align:left;transition:.15s}
.nav-it svg{width:19px;height:19px}
.nav-it:hover{color:#fff;background:rgba(255,255,255,.05)}
.nav-it.active{color:#fff;background:rgba(255,255,255,.07);border-left-color:var(--mc)}
.nav-it.active svg{color:var(--mc)}
.sb-foot{padding:12px 16px 16px;border-top:1px solid rgba(255,255,255,.09)}
.sb-user{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.sb-user .avatar{width:38px;height:38px;font-size:15px}
.sb-user b{display:block;font-size:13px;color:#fff;letter-spacing:.4px}
.sb-user small{display:block;font-size:9.5px;font-weight:800;letter-spacing:1.2px;color:#8fa0b5}
.sb-row2{display:flex;gap:8px;margin-top:8px}
.sb-row2 .btn{flex:1;min-height:42px;font-size:11.5px;padding:8px 6px}
.sb-ver{font-size:10px;color:#64768c;letter-spacing:.8px;text-align:center;margin-top:10px}
.sync-badge{display:flex;align-items:center;justify-content:center;gap:7px;font-size:9.5px;font-weight:800;letter-spacing:1px;margin-bottom:9px;width:100%;background:transparent;border:0;color:inherit;padding:5px 2px;min-height:30px}
.sync-badge .sdot{width:8px;height:8px;border-radius:99px;background:currentColor;flex:none}
.sync-badge.ok{color:#1f9d55}.sync-badge.wait{color:#b7791f}.sync-badge.local{color:#8fa0b5}.sync-badge.err{color:#ff6b6b}
.mainwrap{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:40;background:#fff;border-bottom:3px double var(--ink);display:flex;align-items:center;gap:10px;padding:9px 14px}
.ic-btn{display:inline-flex;align-items:center;justify-content:center;width:40px;height:40px;border-radius:10px;border:1.5px solid var(--line2);background:#fff;color:var(--ink);transition:.15s}
.ic-btn:hover{background:#f2f1ea}
.brand{display:flex;align-items:center;gap:10px;min-width:0;flex:1}
.brand-t{min-width:0}
.brand-t em{display:block;font-style:normal;font-size:8.5px;font-weight:800;letter-spacing:2.6px;color:var(--muted)}
.brand-t b{display:block;font-family:'Barlow Condensed';font-size:18px;font-weight:800;letter-spacing:.8px;line-height:1.15;white-space:nowrap}
.brand-t small{display:block;font-size:9px;font-weight:800;letter-spacing:2px;color:var(--wine)}
.top-right{display:flex;align-items:center;gap:10px;text-align:right}
.d-col small{display:block;font-size:10.5px;font-weight:600;color:var(--muted);white-space:nowrap}
.d-col b{display:block;font-family:'Barlow Condensed';font-size:19px;font-weight:800;letter-spacing:1px;font-variant-numeric:tabular-nums;line-height:1.1}
.d-long{display:none}
.page{width:100%;max-width:1060px;margin:0 auto;padding:16px 14px 40px;flex:1}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.page-head{margin-bottom:14px;padding-left:12px;border-left:4px solid var(--mc,var(--ink))}
.page-head h1{font-family:'Barlow Condensed';font-size:24px;font-weight:800;letter-spacing:.5px;line-height:1.1}
.page-head p{font-size:12.5px;color:var(--muted);font-weight:500}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:700;font-size:13.5px;letter-spacing:.4px;border:1.5px solid transparent;border-radius:11px;padding:12px 18px;min-height:47px;transition:transform .12s,background .15s;white-space:nowrap}
.btn:active{transform:scale(.98)}
.btn-p{background:var(--ink);color:#fff}.btn-p:hover{background:#0e141c}
.btn-o{background:#fff;border-color:var(--line2);color:var(--ink)}.btn-o:hover{border-color:var(--ink)}
.btn-green{background:var(--green);color:#fff}.btn-green:hover{background:#156039}
.btn-danger{background:#b3261e;color:#fff}.btn-danger:hover{background:#8f1d17}
.btn-wa{background:#17a34a;color:#fff;font-size:15px}.btn-wa:hover{background:#128a3e}
.btn-block{width:100%}
.btn.sm{min-height:38px;padding:8px 13px;font-size:12px;border-radius:9px}
.field{margin-bottom:15px}
.f-label{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:11.5px;font-weight:800;letter-spacing:.9px;color:#3d4654;margin-bottom:6px}
.f-label.big{font-size:13px}
.f-label .req{color:#b3261e}
.auto-tag{font-style:normal;font-size:9px;font-weight:800;letter-spacing:1px;color:var(--green);background:#e8f5ee;border:1px solid #bfe0cd;border-radius:99px;padding:2px 8px}
.inp{width:100%;min-height:48px;border:1.5px solid var(--line2);border-radius:10px;padding:10px 14px;font-size:15px;background:#fff;transition:border-color .15s,box-shadow .15s}
.inp:focus{outline:none;border-color:var(--ink);box-shadow:0 0 0 3px rgba(28,37,48,.08)}
.hint{font-size:11.5px;color:var(--muted);margin-top:5px}
.mini-note{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:800;letter-spacing:.5px;color:var(--parkir);background:#fdf6e3;border:1px solid #ecd9a8;border-radius:8px;padding:7px 10px;margin-top:8px}
.mini-note svg{width:14px;height:14px}
.mini-note.teal{color:var(--kbm);background:#ecfeff;border-color:#a5e3ec}
.f-err{display:none;font-size:12px;font-weight:700;color:#b3261e;margin-top:5px}
.f-err.show{display:block}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.money{display:flex;align-items:center;border:1.5px solid var(--line2);border-radius:10px;background:#fff;overflow:hidden}
.money:focus-within{border-color:var(--ink);box-shadow:0 0 0 3px rgba(28,37,48,.08)}
.money span{padding:0 0 0 13px;font-weight:800;color:var(--muted);font-size:14px}
.money input{border:0;outline:none;flex:1;min-width:0;min-height:48px;padding:10px 13px 10px 7px;font-size:16px;font-weight:700;font-variant-numeric:tabular-nums;text-align:right}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chips button{border:1px solid var(--line2);background:#fafaf6;border-radius:99px;padding:6px 12px;font-size:11.5px;font-weight:700;color:#4a5563}
.chips button:hover{border-color:var(--ink);color:var(--ink)}
.scan-btn{display:inline-flex;align-items:center;gap:5px;border:1.5px solid var(--ink);background:#fffdf4;color:var(--ink);border-radius:99px;padding:6px 11px;font-size:10.5px;font-weight:800;letter-spacing:.8px}
.scan-btn svg{width:14px;height:14px}
.foto-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.foto-item{position:relative;border:1.5px solid var(--line2);border-radius:10px;overflow:hidden;background:#f4f3ee}
.foto-item img{width:100%;height:110px;object-fit:cover;display:block}
.foto-item .fx{position:absolute;top:5px;right:5px;width:26px;height:26px;border:0;border-radius:8px;background:rgba(20,25,35,.75);color:#fff;display:flex;align-items:center;justify-content:center}
.foto-item .fx svg{width:14px;height:14px}
.profile-lock{display:flex;align-items:center;gap:12px;background:#f2faf5;border:1.5px solid #bfe0cd;border-radius:11px;padding:12px 14px}
.profile-lock .avatar{width:42px;height:42px;font-size:16px}
.profile-lock .p-mid{flex:1;min-width:0}
.profile-lock .p-mid b{display:block;font-size:15px}
.profile-lock .p-mid small{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--muted);font-weight:700;flex-wrap:wrap}
.ss{position:relative}
.ss-box{display:flex;align-items:center;gap:8px;border:1.5px solid var(--line2);border-radius:10px;background:#fff;padding:0 12px}
.ss-box:focus-within{border-color:var(--ink);box-shadow:0 0 0 3px rgba(28,37,48,.08)}
.ss-box svg{color:var(--muted)}
.ss-box input{border:0;outline:none;flex:1;min-width:0;min-height:48px;font-size:15px;font-weight:600;background:transparent}
.ss-clear{display:none;align-items:center;justify-content:center;width:26px;height:26px;border:0;border-radius:8px;background:#efeee7;color:var(--muted)}
.ss-list{display:none;position:absolute;top:calc(100% + 4px);left:0;right:0;max-height:230px;overflow:auto;background:#fff;border:1px solid var(--line2);border-radius:11px;box-shadow:0 14px 40px rgba(15,20,28,.18);z-index:30}
.ss.open .ss-list{display:block}
.ss-opt{display:flex;flex-direction:column;gap:1px;width:100%;text-align:left;border:0;background:#fff;padding:11px 14px;border-bottom:1px solid var(--line)}
.ss-opt:hover{background:#f4f6f9}
.ss-opt span{font-weight:700;font-size:14px}
.ss-opt small{font-size:11px;color:var(--muted);font-weight:600}
.ss-empty{padding:14px;text-align:center;font-size:12.5px;color:var(--muted);font-weight:600}
.fsec{margin-bottom:14px}
.fsec-h{display:flex;gap:11px;align-items:center;padding:12px 14px;border:1px solid var(--line);border-bottom:0;border-radius:var(--radius) var(--radius) 0 0;background:#fbfaf6}
.fsec-ic{display:flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:9px;background:var(--navy);color:#fff;flex:none}
.fsec-ic svg{width:17px;height:17px}
.fsec-h b{display:block;font-family:'Barlow Condensed';font-size:15.5px;font-weight:800;letter-spacing:1.2px}
.fsec-h small{display:block;font-size:11px;color:var(--muted);font-weight:500}
.fsec-b{border:1px solid var(--line);border-radius:0 0 var(--radius) var(--radius);padding:16px 14px;background:#fff}
.dn-input{width:100%;border:2.5px solid var(--ink);border-radius:12px;padding:10px 14px;font-family:'Barlow Condensed';font-size:31px;font-weight:800;letter-spacing:3px;text-align:center;background:#fffdf4;min-height:66px;font-variant-numeric:tabular-nums}
.dn-input:focus{outline:none;box-shadow:0 0 0 4px rgba(240,162,2,.28)}
.qty-inp{font-weight:800;font-size:17px}
.tarif-box{border:1.5px solid var(--line2);border-radius:11px;overflow:hidden}
.t-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 14px;border-bottom:1px solid var(--line)}
.t-row:last-child{border-bottom:0}
.t-row span{font-size:11.5px;font-weight:800;letter-spacing:.7px;color:var(--muted)}
.t-row b{font-size:16px;font-variant-numeric:tabular-nums}
.c-uj{color:var(--uj)} .c-ub{color:var(--ub)} .c-kbm{color:var(--kbm)}
.ub-tag{font-style:normal;font-size:9.5px;font-weight:800;letter-spacing:.8px;border:1px solid currentColor;border-radius:99px;padding:2px 8px;margin-left:6px;vertical-align:2px}
.t-src{padding:8px 14px;background:#f7f6f1;font-size:11px;font-weight:700;letter-spacing:.5px;color:var(--muted);border-top:1px solid var(--line)}
.tarif-warn{display:flex;gap:8px;align-items:flex-start;font-size:12.5px;font-weight:600;color:#8a5a00;background:#fdf6e3;border:1px solid #ecd9a8;border-radius:10px;padding:11px 13px}
.ubcalc{display:flex;align-items:center;justify-content:space-between;gap:10px;background:#eef8f2;border:1.5px solid #bfe0cd;border-radius:10px;padding:11px 14px;font-size:13px;font-weight:700;color:#14532d;margin-top:10px}
.ubcalc b{font-size:16px;font-variant-numeric:tabular-nums}
.kbmcalc{display:flex;align-items:center;justify-content:space-between;gap:10px;background:#ecfeff;border:1.5px solid #a5e3ec;border-radius:10px;padding:11px 14px;font-size:13px;font-weight:700;color:#155e75;margin-top:10px}
.kbmcalc b{font-size:16px;font-variant-numeric:tabular-nums}
.flow{display:flex;flex-direction:column;align-items:center;gap:4px;margin-top:12px;padding:12px;border:1.5px dashed var(--line2);border-radius:11px;background:#fafaf6}
.flow svg{color:var(--muted)}
.fw small{font-size:9px;font-weight:800;letter-spacing:1.4px;color:var(--muted)}
.fw b{font-size:14px;font-weight:800}
.fw.final b{color:var(--green);font-size:15px}
.fw{display:flex;flex-direction:column;align-items:center;gap:1px}
.foto-btns{display:flex;gap:10px;flex-wrap:wrap}
.sum-panel{border:2px solid var(--ink);border-radius:var(--radius);background:#fff;box-shadow:var(--shadow);padding:16px 15px}
.sum-h{display:flex;align-items:center;gap:8px;font-family:'Barlow Condensed';font-size:16px;font-weight:800;letter-spacing:1.4px;margin-bottom:8px}
.sum-r{display:flex;justify-content:space-between;gap:14px;font-size:13px;padding:5.5px 0;border-bottom:1px dashed var(--line)}
.sum-r span{color:var(--muted);font-weight:600}
.sum-r b{text-align:right;font-variant-numeric:tabular-nums}
.sum-total{display:flex;justify-content:space-between;align-items:center;margin:10px 0 14px;padding:12px 14px;background:var(--navy);color:#fff;border-radius:11px}
.sum-total span{font-size:11px;font-weight:800;letter-spacing:1.4px}
.sum-total b{font-family:'Barlow Condensed';font-size:26px;font-weight:800;font-variant-numeric:tabular-nums}
.form-wrap{max-width:740px;margin:0 auto}
.dash-filter{padding:14px;margin-bottom:14px}
.seg{display:flex;background:#e9e7df;border-radius:11px;padding:3px;gap:2px;margin-bottom:12px}
.seg button{flex:1;border:0;background:transparent;padding:9px 4px;border-radius:8px;font-weight:800;font-size:11px;letter-spacing:.4px;color:#59616d;min-height:40px}
.seg button.on{background:var(--ink);color:#fff}
.dash-grid{display:grid;gap:14px}
@media(min-width:860px){.dash-grid{grid-template-columns:5fr 6fr;align-items:start}}
.hero{background:var(--navy);color:#fff;border-radius:var(--radius);padding:20px 18px;position:relative;overflow:hidden}
.hero:after{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--amber)}
.hero small{display:block;font-size:10.5px;font-weight:800;letter-spacing:2px;color:#9db0c6}
.hero .big{display:block;font-family:'Barlow Condensed';font-weight:800;font-size:40px;line-height:1.05;margin:8px 0 10px;font-variant-numeric:tabular-nums}
.hero .meta{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:700;color:#c6d2e0;flex-wrap:wrap}
.hero .meta i.dot{width:7px;height:7px;border-radius:99px;background:var(--amber)}
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.stat{padding:14px}
.stat small{display:block;font-size:9.5px;font-weight:800;letter-spacing:1.2px;color:var(--muted)}
.stat b{display:block;font-family:'Barlow Condensed';font-size:24px;font-weight:800;margin-top:3px;font-variant-numeric:tabular-nums}
.ledger{padding:6px 16px 14px}
.ledger h3{font-family:'Barlow Condensed';font-size:15px;font-weight:800;letter-spacing:1.4px;padding:12px 0 4px;color:#3d4654}
.lg-row{padding:11px 0;border-bottom:1px dashed var(--line)}
.lg-row:last-child{border-bottom:0}
.lg-top{display:flex;align-items:center;gap:9px}
.lg-dot{width:9px;height:9px;border-radius:3px;background:var(--c);flex:none}
.lg-top b{font-size:12px;font-weight:800;letter-spacing:.8px;color:#3d4654;flex:1}
.lg-top .amt{font-family:'Barlow Condensed';font-size:19px;font-weight:800;font-variant-numeric:tabular-nums}
.lg-top .amt.minus{color:var(--kbm)}
.lg-bar{height:5px;background:#efede6;border-radius:99px;margin-top:7px;overflow:hidden}
.lg-bar i{display:block;height:100%;background:var(--c);border-radius:99px;min-width:3px}
.recent{padding:6px 16px 14px;margin-top:14px}
.rc-item{display:flex;align-items:center;gap:11px;width:100%;text-align:left;background:none;border:0;border-bottom:1px dashed var(--line);padding:11px 0}
.rc-item:last-child{border-bottom:0}
.rc-item:hover b{color:var(--blue)}
.rc-time{font-size:11px;font-weight:700;color:var(--muted);width:44px;flex:none}
.rc-item .rc-mid{flex:1;min-width:0}
.rc-item b{display:block;font-size:13.5px}
.rc-item small{display:block;font-size:11px;color:var(--muted);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rc-item .amt{font-weight:800;font-variant-numeric:tabular-nums;font-size:13.5px}
.toolbar{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.toolbar .search{flex:1;min-width:190px;position:relative}
.toolbar .search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted)}
.toolbar .search .inp{padding-left:38px}

function compressImage(file, max=1280, q=0.72){
  return new Promise((res,rej)=>{
    const img=new Image(); const url=URL.createObjectURL(file);
    img.onload=()=>{ const r=Math.min(1,max/Math.max(img.width,img.height));
      const c=document.createElement('canvas'); c.width=Math.round(img.width*r); c.height=Math.round(img.height*r);
      c.getContext('2d').drawImage(img,0,0,c.width,c.height); URL.revokeObjectURL(url);
      res(c.toDataURL('image/jpeg',q)); };
    img.onerror=()=>{URL.revokeObjectURL(url);rej(new Error('load'));}; img.src=url;
  });
}

  return ((h2>>>0).toString(16))+'-'+((h1>>>0).toString(16));

async function cloudPrepareFotos(id,fotos){
  const list=normalizeFotos(fotos), out=[]; let i=0;
  for(const f of list){
    if(f&&String(f).startsWith('data:')&&f.length>600000){
      const up=await uploadFoto(id+'-'+i,f).catch(()=>null); out.push(up||'');
    } else out.push(f);
    i++;
  }
  return out.filter(Boolean);
}
async function pushBatch(k,items){
  const col=COLS[k], prepared=[];
  for(const it of items){ const doc={...it};
    if(k==='transactions') doc.fotoSuratJalan=await cloudPrepareFotos(doc.id,doc.fotoSuratJalan);
    prepared.push(doc);
  }
  for(let i=0;i<prepared.length;i+=300){
    const batch=CLOUD.db.batch();
    prepared.slice(i,i+300).forEach(doc=>batch.set(CLOUD.db.collection(col).doc(doc.id),doc));
    await batch.commit().catch(err=>{ CLOUD.diag['write']=(err&&err.code)||'unknown'; console.warn('pushBatch',col,err&&err.code); });
  }
}

function ubType(ub){ return ub>0?(ub<1000?'PER KARTON':'PER MOBIL'):'-'; }
function calcUb(ub,qty){ const tipeUb=ubType(ub);
  const totalUb=tipeUb==='PER KARTON'?Math.round((Number(ub)||0)*(Number(qty)||0)):(Number(ub)||0);
  return {tipeUb,totalUb}; }
function calcTotal(d){ return (d.uj||0)+(d.totalUb||0)-(d.kbm||0)+(d.uangParkir||0)+(d.uangStandby||0)+(d.uangTambahan||0); }
function ujBersihOf(t){ return (t.uj||0)-(t.kbm||0); }
function fixKbmTotal(t){
  if(t&&(t.kbm||0)>0){
    const c=(t.uj||0)+(t.totalUb||0)-(t.kbm||0)+(t.uangParkir||0)+(t.uangStandby||0)+(t.uangTambahan||0);
    if(t.total!==c) t.total=c;
  }

}
function genTrxId(){
  const d=new Date();
  const prefix='SMJ-'+d.getFullYear()+pad2(d.getMonth()+1)+pad2(d.getDate())+'-';
  const list=DataService.getTransactions().filter(t=>(t.id||'').startsWith(prefix));
  const max=list.reduce((m,t)=>Math.max(m,parseInt(t.id.slice(-4),10)||0),0);
  return prefix+String(max+1).padStart(4,'0');
}
function periodStart(p){
  const s=new Date(); s.setHours(0,0,0,0);
  if(p==='today') return s.getTime();
  if(p==='week'){ const d=(s.getDay()+6)%7; s.setDate(s.getDate()-d); return s.getTime(); }
  if(p==='month'){ s.setDate(1); return s.getTime(); }
  return 0;
}

  el.innerHTML='<div class="ss-box"><i data-lucide="search"></i>'+
    '<input type="text" autocomplete="off" placeholder="'+esc(placeholder)+'">'+
    '<button type="button" class="ss-clear" tabindex="-1" aria-label="Bersihkan"><i data-lucide="x"></i></button></div>'+
    '<div class="ss-list"></div>';
  mount.appendChild(el);
  const input=el.querySelector('input'), list=el.querySelector('.ss-list'), clearBtn=el.querySelector('.ss-clear');
  let cur=value, opts=options;
  function renderList(q){
    const ql=(q||'').trim().toLowerCase();
    const f=ql?opts.filter(o=>o.label.toLowerCase().includes(ql)||(o.sub||'').toLowerCase().includes(ql)):opts;
    list.innerHTML=f.length
      ? f.map(o=>'<button type="button" class="ss-opt" data-id="'+esc(o.id)+'"><span>'+esc(o.label)+'</span>'+(o.sub?'<small>'+esc(o.sub)+'</small>':'')+'</button>').join('')
      : '<div class="ss-empty">Tidak ditemukan</div>';
  }
  function open(){ el.classList.add('open'); renderList(input.value===cur?'':input.value); }

  input.addEventListener('input',()=>{ clearBtn.style.display=input.value?'flex':'none'; open(); });
  input.addEventListener('blur',()=>setTimeout(()=>el.classList.remove('open'),130));
  list.addEventListener('mousedown',e=>{
    const b=e.target.closest('.ss-opt'); if(!b) return;

    el.classList.remove('open'); if(onSelect) onSelect(opt);
  });
  clearBtn.addEventListener('click',()=>{ cur=''; input.value=''; clearBtn.style.display='none'; el.classList.remove('open'); if(onClear) onClear(); input.focus(); });
  if(cur) clearBtn.style.display='flex';
  renderList('');
  return { set(v){ cur=v; input.value=v; clearBtn.style.display=v?'flex':'none'; },
    setOptions(o){ opts=o; if(el.classList.contains('open')) renderList(input.value===cur?'':input.value); }, el };
}

function healMasters(){
  let n=0;
  const drv=DB.read(KEYS.drivers,[]);
  const nopolSet=new Set(drv.map(d=>(d.noPolisi||'').toUpperCase()));
  const addD=REAL_DRIVERS.filter(d=>!nopolSet.has(d.noPolisi.toUpperCase()));
  if(addD.length){ DB.write(KEYS.drivers,drv.concat(addD.map(d=>({id:uid('DRV'),...d})))); n+=addD.length; }
  const dst=DB.read(KEYS.destinations,[]);
  const namaSet=new Set(dst.map(d=>(d.nama||'').toUpperCase()));
  const addT=REAL_DESTINATIONS.filter(d=>!namaSet.has(d.nama.toUpperCase()));
  if(addT.length){ DB.write(KEYS.destinations,dst.concat(addT.map(d=>({id:uid('DST'),...d})))); n+=addT.length; }
  return n;
}
function seedIfEmpty(){
  const ver=DB.read('smj_seed_version',0);
  if(ver<HEAL_VERSION) HEALED=healMasters();
  const st=DB.read(KEYS.settings,null);
  if(st===null) DB.write(KEYS.settings,{adminWa:'6281234567890',adminPw:pwHash('smj123')});
  else if(!st.adminPw) DB.write(KEYS.settings,{...st,adminPw:pwHash('smj123')});
  DB.write('smj_seed_version',SEED_VERSION);
}

let zxingP=null,zbarP=null;
function loadZXing(){
  if(window.ZXing) return Promise.resolve();
  if(!zxingP) zxingP=new Promise((res,rej)=>{ const s=document.createElement('script');
    s.src='https://unpkg.com/@zxing/library@0.21.3/umd/index.min.js'; s.onload=()=>res();
    s.onerror=()=>{zxingP=null;rej(new Error('cdn'));}; document.head.appendChild(s); });
  return zxingP;
}
function loadZbar(){
  if(window.zbarWasm&&window.zbarWasm.scanImageData) return Promise.resolve();
  if(!zbarP){ zbarP=new Promise((res,rej)=>{
    window.__zbarOk=()=>res(); window.__zbarErr=()=>{zbarP=null;rej(new Error('cdn'));};
    const s=document.createElement('script'); s.type='module';
    s.textContent="import('https://cdn.jsdelivr.net/npm/@undecaf/zbar-wasm@0.9.15/dist/index.js').then(m=>{window.zbarWasm=m;window.__zbarOk();}).catch(()=>window.__zbarErr());";
    document.head.appendChild(s); }); }
  return zbarP;
}
function zxHints(){
  const m=new Map();
  m.set(ZXing.DecodeHintType.TRY_HARDER,true);
  m.set(ZXing.DecodeHintType.POSSIBLE_FORMATS,[
    ZXing.BarcodeFormat.CODE_128,ZXing.BarcodeFormat.CODE_39,ZXing.BarcodeFormat.CODE_93,
    ZXing.BarcodeFormat.EAN_13,ZXing.BarcodeFormat.EAN_8,ZXing.BarcodeFormat.UPC_A,
    ZXing.BarcodeFormat.UPC_E,ZXing.BarcodeFormat.ITF,ZXing.BarcodeFormat.CODABAR,
    ZXing.BarcodeFormat.QR_CODE,ZXing.BarcodeFormat.DATA_MATRIX,ZXing.BarcodeFormat.PDF_417]);
  return m;
}
function makeZXing(){ return new ZXing.BrowserMultiFormatReader(zxHints()); }
function symText(s){ if(!s) return '';
  if(typeof s.decode==='function'){ try{return s.decode()||'';}catch(e){} }
  if(s.data){ try{return new TextDecoder().decode(s.data);}catch(e){} }
  return ''; }
async function decodeCanvasHard(cv){
  const tries=[cv];
  const cg=document.createElement('canvas'); cg.width=cv.width; cg.height=cv.height;
  cg.getContext('2d').filter='grayscale(1) contrast(1.8) brightness(1.08)'; cg.getContext('2d').drawImage(cv,0,0);
  tries.push(cg);
  if(Math.max(cv.width,cv.height)<1500){
    const cu=document.createElement('canvas');
    cu.width=Math.min(cv.width*2,3200); cu.height=Math.min(cv.height*2,3200);
    const uctx=cu.getContext('2d'); uctx.imageSmoothingEnabled=true; uctx.drawImage(cv,0,0,cu.width,cu.height);
    tries.push(cu);
  }
  for(const c of tries){
    try{ await loadZXing(); const rd=makeZXing();
      const res=await rd.decodeFromImageUrl(c.toDataURL('image/png'));
      try{rd.reset();}catch(_){}
      const t=res&&res.getText?res.getText():''; if(t) return t;
    }catch(e){}
    try{ await loadZbar();
      const ctx=c.getContext('2d',{willReadFrequently:true});
      const syms=await window.zbarWasm.scanImageData(ctx.getImageData(0,0,c.width,c.height));
      for(const s of (syms||[])){ const t=symText(s); if(t) return t; }
    }catch(e){}
  }
  return null;
}
function loadImgEl(url){ return new Promise((res,rej)=>{ const im=new Image();
  im.onload=()=>res(im); im.onerror=()=>rej(new Error('img')); im.src=url; }); }
async function decodeImageFile(f){
  const url=URL.createObjectURL(f);
  try{ const im=await loadImgEl(url);
    const scale=Math.min(1,2400/Math.max(im.naturalWidth,im.naturalHeight));
    const c=document.createElement('canvas');
    c.width=Math.round(im.naturalWidth*scale); c.height=Math.round(im.naturalHeight*scale);
    c.getContext('2d').drawImage(im,0,0,c.width,c.height);
    return await decodeCanvasHard(c);
  } finally{ URL.revokeObjectURL(url); }
}

function matchDash(t,f){
  if(f.period!=='all'&&(t.createdAt||0)<periodStart(f.period)) return false;
  if(f.supir&&t.namaSupir!==f.supir) return false;
  if(f.unit&&t.unit!==f.unit) return false;
  if(f.tujuan&&t.tujuanAkhir!==f.tujuan) return false;
  return true;
}

function svgToPngFile(svg,name){
  return new Promise((res,rej)=>{
    const im=new Image();
    im.onload=()=>{
      const scale=2; const c=document.createElement('canvas');
      c.width=im.naturalWidth*scale; c.height=im.naturalHeight*scale;
      const ctx=c.getContext('2d'); ctx.fillStyle='#fff'; ctx.fillRect(0,0,c.width,c.height);
      ctx.drawImage(im,0,0,c.width,c.height);
      c.toBlob(b=>{ if(!b){rej(new Error('blob'));return;} res(new File([b],name,{type:'image/png'})); },'image/png');
    };
    im.onerror=()=>rej(new Error('svg'));
    im.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg);
  });
}
async function makeStrukFile(t){
  const fotos=await loadStrukFotos(t);

}
function downloadBlob(blob,name){
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),4000);
}
function buildWAMsg(t){
  const kb=t.kbm||0; const L=[];
  L.push('*PENGAJUAN UJ — TRANSPORT SMJ*');
  L.push('ID: '+t.id);
  L.push('SUPIR: '+t.namaSupir);
  L.push('NO POL: '+t.noPolisi);

  L.push('UJ: '+formatRupiah(t.uj));
  L.push('KBM: '+(kb>0?'-':'')+formatRupiah(kb)+(kb>0?' (POTONG DARI UJ)':''));
  if(kb>0) L.push('UJ BERSIH: '+formatRupiah(ujBersihOf(t)));
  L.push('UB: '+formatRupiah(t.totalUb)+' ('+t.tipeUb+')');

async function sendStrukWA(t){
  toast('Menyiapkan gambar struk…',{icon:'loader-2',dur:2500});
  const msg=buildWAMsg(t); const files=[];
  try{ files.push(await makeStrukFile(t)); }catch(e){}
  const fotos=await loadStrukFotos(t); let i=1;
  for(const f of fotos){
    try{ const b=await (await fetch(f.src)).blob();
      files.push(new File([b],'surat-jalan-'+t.id+'-'+(i++)+'.jpg',{type:b.type||'image/jpeg'}));
    }catch(e){}
  }
  if(files.length&&navigator.canShare&&navigator.canShare({files})){
    try{ await navigator.share({files,text:msg});
      toast('<b>Struk terkirim</b><small>Pilih WhatsApp lalu kontak tujuan.</small>',{type:'ok',icon:'share-2',dur:6000});
      return;
    }catch(err){ if(err&&err.name==='AbortError') return; }
  }
  if(files.length) downloadBlob(files[0],files[0].name);
  const s=DataService.getSettings();
  window.open('https://wa.me/'+(s.adminWa||'').replace(/\D/g,'')+'?text='+encodeURIComponent(msg),'_blank');
  toast('WhatsApp dibuka & gambar struk diunduh. <b>Lampirkan gambar struk ke chat sebelum KIRIM.</b>',{type:'info',icon:'info',dur:10000});
}

    '<button class="act-btn h" data-act="hapus" data-id="'+esc(d.id)+'"><i data-lucide="trash-2"></i>HAPUS</button></div></div>'+
    '<div class="dest-grid">'+UNITS.map(u=>{
      const tr=(d.tarif&&d.tarif[u])||null;
      if(!tr) return '<div class="dest-cell missing"><b>'+u+'</b><span>Belum diatur</span></div>';
      const tag=tr.ub>0?(tr.ub<1000?'PER KARTON':'PER MOBIL'):'';
      return '<div class="dest-cell'+((tr.uj===0||tr.ub===0)?' missing':'')+'"><b>'+u+'</b>'+
        '<span>UJ '+formatRupiah(tr.uj)+'</span><span>UB '+formatRupiah(tr.ub)+(tag?'<em class="c-ub">'+tag+'</em>':'')+'</span></div>';
    }).join('')+'</div></div>').join('')+'</div>';
  icons();
}
function openDestForm(d){
  openModal({ title:d?'EDIT TUJUAN':'TAMBAH TUJUAN', wide:true,
    body:'<div class="field"><div class="f-label"><span>NAMA TUJUAN / DC <b class="req">*</b></span></div><input id="dtNama" class="inp" maxlength="50" placeholder="Contoh: MIDI BEKASI" style="text-transform:uppercase"></div>'+
      UNITS.map((u,i)=>'<div class="unit-tarif"><div class="ut-h">'+u+'<span class="ut-tag" id="dtTag'+i+'">—</span></div>'+
      '<div class="grid2"><div><div class="f-label"><span>UJ</span></div><div id="dtUJ'+i+'"></div></div>'+
      '<div><div class="f-label"><span>UB &lt;1000=KARTON</span></div><div id="dtUB'+i+'"></div></div></div></div>').join(''),
    foot:'<button class="btn btn-o" data-b>BATAL</button><button class="btn btn-p" data-s>'+(d?'SIMPAN PERUBAHAN':'SIMPAN')+'</button>',
    onOpen(w,close){
      const nEl=w.querySelector('#dtNama');
      if(d) nEl.value=d.nama;
      nEl.addEventListener('input',()=>nEl.value=nEl.value.toUpperCase());
      const money=[]; let i=0;
      for(const u of UNITS){
        const tr=(d&&d.tarif&&d.tarif[u])||{uj:0,ub:0};
        const mUj=moneyInput(w.querySelector('#dtUJ'+i),{value:tr.uj});
        const mUb=moneyInput(w.querySelector('#dtUB'+i),{value:tr.ub,onInput:v=>{
          w.querySelector('#dtTag'+i).textContent=v>0?(v<1000?'PER KARTON':'PER MOBIL'):'—';
        }});
        w.querySelector('#dtTag'+i).textContent=tr.ub>0?(tr.ub<1000?'PER KARTON':'PER MOBIL'):'—';
        money.push({uj:mUj,ub:mUb}); i++;
      }
      w.querySelector('[data-b]').onclick=close;
      w.querySelector('[data-s]').onclick=()=>{
        const nama=nEl.value.trim().toUpperCase();
        if(!nama){ toast('Nama tujuan wajib diisi.',{type:'warn',icon:'alert-triangle'}); return; }
        const tarif={};
        UNITS.forEach((u,idx)=>tarif[u]={uj:money[idx].uj.get(),ub:money[idx].ub.get()});
        const dup=DataService.getDestinations().find(x=>x.nama.toUpperCase()===nama&&(!d||x.id!==d.id));
        const save=()=>{
          if(d){ DataService.updateDestination(d.id,{nama,tarif}); toast('Data tujuan diperbarui.',{type:'ok',icon:'check-circle-2'}); }
          else{ DataService.addDestination({nama,tarif}); toast('Tujuan ditambahkan.',{type:'ok',icon:'check-circle-2'}); }
          close(); render();
        };
        if(dup) confirmModal({title:'TUJUAN SUDAH TERDAFTAR',msg:'Tujuan <b>'+esc(nama)+'</b> sudah ada. Tetap simpan?',okLabel:'SIMPAN SAJA',okClass:'btn-amber',onOk:save});
        else save();
      };
    }});
}
function openSettings(){
  if(!AUTH.isAdmin()){ toast('Pengaturan hanya untuk admin/pengurus.',{icon:'shield'}); return; }
  const s=DataService.getSettings();
  openModal({ title:'PENGATURAN', wide:true,
    body:
      '<div class="field"><div class="f-label"><span>NOMOR WHATSAPP ADMIN</span></div>'+
      '<input id="stWa" class="inp" inputmode="numeric" value="'+esc(s.adminWa||'')+'" placeholder="628xxxxxxxxxx">'+
      '<div class="hint">Format internasional tanpa +, contoh: 6281234567890.</div></div>'+
      '<div class="field"><div class="f-label"><span>PASSWORD ADMIN</span></div>'+
      '<button type="button" class="btn btn-o btn-block" id="stPw"><i data-lucide="key-round"></i> GANTI PASSWORD ADMIN</button></div>'+
      '<div class="field"><div class="f-label"><span>SINKRONISASI FIREBASE</span></div>'+
      '<div class="card" style="padding:13px;box-shadow:none"><button class="sync-badge" id="stSync"><i class="sdot"></i>…</button>'+
      '<div class="hint" style="text-align:center;margin-top:6px">Data tersimpan di perangkat lalu disinkronkan ke cloud. Ketuk badge untuk diagnosis.</div>'+
      (CLOUD.available?
        '<div class="grid2" style="margin-top:11px">'+
        '<button type="button" class="btn btn-o sm" id="btnPush"><i data-lucide="cloud-upload"></i> KIRIM LOKAL → CLOUD</button>'+
        '<button type="button" class="btn btn-o sm" id="btnPull"><i data-lucide="cloud-download"></i> TARIK CLOUD → LOKAL</button></div>'
        :'<div class="hint" style="text-align:center;margin-top:6px;color:#b3261e;font-weight:700">Cloud tidak aktif — mode lokal.</div>')+
      '</div></div>'+
      '<div class="field"><div class="f-label"><span>BACKUP & PULIHKAN DATA</span></div>'+
      '<div class="grid2"><button type="button" class="btn btn-o" id="stBackup"><i data-lucide="download"></i> BACKUP DATA</button>'+
      '<button type="button" class="btn btn-o" id="stRestore"><i data-lucide="upload"></i> PULIHKAN DATA</button></div>'+
      '<input type="file" id="stFile" accept="application/json,.json" hidden>'+
      '<div class="hint">Backup menyimpan seluruh data ke file JSON.</div></div>',
    foot:'<button class="btn btn-o" data-b>BATAL</button><button class="btn btn-p" data-s>SIMPAN</button>',
    onOpen(w,close){
      updateSyncBadge();
      w.querySelector('[data-b]').onclick=close;
      w.querySelector('[data-s]').onclick=()=>{
        const wa=w.querySelector('#stWa').value.replace(/\D/g,'');
        if(wa.length<9){ toast('Nomor WhatsApp tidak valid.',{type:'warn',icon:'alert-triangle'}); return; }
        DataService.saveSettings({...DataService.getSettings(),adminWa:wa}); close();
        toast('Pengaturan disimpan.',{type:'ok',icon:'check-circle-2'});
      };
      w.querySelector('#stPw').onclick=()=>{close();openAdminPw();};
      w.querySelector('#stBackup').onclick=backupData;
      w.querySelector('#stRestore').onclick=()=>w.querySelector('#stFile').click();
      w.querySelector('#stFile').addEventListener('change',e=>{ restoreData(e.target.files[0]); e.target.value=''; });
      const bp=w.querySelector('#btnPush');
      if(bp) bp.onclick=()=>confirmModal({title:'KIRIM DATA LOKAL KE CLOUD',
        msg:'Seluruh data di perangkat ini akan ditulis ke cloud. Lanjutkan?',
        okLabel:'KIRIM',okClass:'btn-p',
        onOk:async()=>{ toast('Mengirim ke cloud…',{icon:'cloud-upload',dur:2500});
          await cloudPushAll(); toast('Data lokal terkirim ke cloud.',{type:'ok',icon:'check-circle-2'}); }});
      const bpl=w.querySelector('#btnPull');
      if(bpl) bpl.onclick=()=>confirmModal({title:'TARIK DATA DARI CLOUD',
        msg:'Data di perangkat ini akan <b>DITIMPA</b> dengan data cloud. Lanjutkan?',
        okLabel:'TARIK',okClass:'btn-danger',
        onOk:()=>cloudPullAll().then(()=>{closeAllModals();render();toast('Data cloud ditarik.',{type:'ok',icon:'cloud-download'});})
          .catch(()=>toast('Gagal menarik data.',{type:'warn',icon:'cloud-off'}))});
    }});
}
function backupData(){
  const payload={app:'TRANSPORT SMJ',version:8,exportedAt:new Date().toISOString(),
    drivers:DataService.getDrivers(),destinations:DataService.getDestinations(),
    transactions:DataService.getTransactions(),settings:DataService.getSettings()};
  const blob=new Blob([JSON.stringify(payload)],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
  a.download='backup-smj-'+fmtDateSlash(new Date()).replace(/\//g,'-')+'.json';
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(a.href);
  toast('Backup diunduh.',{type:'ok',icon:'download'});
}
function restoreData(file){
  if(!file) return;
  const r=new FileReader();
  r.onload=()=>{
    let data;
    try{ data=JSON.parse(r.result); }catch(e){ toast('File backup tidak valid.',{type:'warn',icon:'alert-triangle'}); return; }
    if(!data||!Array.isArray(data.drivers)||!Array.isArray(data.destinations)||!Array.isArray(data.transactions)){
      toast('Struktur backup tidak dikenali.',{type:'warn',icon:'alert-triangle'}); return;
    }
    confirmModal({ title:'PULIHKAN DATA',
      msg:'Pulihkan: <b>'+data.drivers.length+'</b> supir · <b>'+data.destinations.length+'</b> tujuan · <b>'+data.transactions.length+'</b> transaksi? Data saat ini ditimpa.',
      okLabel:'PULIHKAN', okClass:'btn-danger',
      onOk(){
        DB.write(KEYS.drivers,data.drivers); DB.write(KEYS.destinations,data.destinations);
        DB.write(KEYS.transactions,data.transactions.map(fixKbmTotal));
        if(data.settings) DB.write(KEYS.settings,data.settings);
        if(CLOUD.available) cloudPushAll();
        closeAllModals(); render(); toast('Data dipulihkan.',{type:'ok',icon:'check-circle-2'});
      }});
  };
  r.readAsText(file);
}
function navigate(id){
  State.page=id;
  document.querySelectorAll('.nav-it').forEach(b=>b.classList.toggle('active',b.dataset.page===id));
  closeSidebar(); render(); window.scrollTo({top:0});
}
function render(){
  closeSidebar();
  const ses=AUTH.get();
  if(!ses){ renderLogin(); return; }
  if(ses.role==='driver'){
    if(!['dHome','dInput','dHistory'].includes(State.page)) State.page='dHome';
    if(State.page==='dHome') renderDriverHome();
    else if(State.page==='dInput') renderInput();
    else renderDriverHistory();
  } else {
    if(!['dashboard','input','history','drivers','dest'].includes(State.page)) State.page='dashboard';
    if(State.page==='dashboard') renderDashboard();
    else if(State.page==='input') renderInput();
    else if(State.page==='history') renderHistory();
    else if(State.page==='drivers') renderDrivers();
    else if(State.page==='dest') renderDest();
  }
  icons();
}
function openSidebar(){ $('#sidebar').classList.add('open'); $('#overlay').classList.add('show'); }
function closeSidebar(){ $('#sidebar').classList.remove('open'); $('#overlay').classList.remove('show'); }
function tickClock(){
  const d=new Date();
  const t=d.toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit',second:'2-digit'}).replace(/\./g,':');
  const long=d.toLocaleDateString('id-ID',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
  const short=fmtDateSlash(d);
  document.querySelectorAll('.js-clock').forEach(e=>e.textContent=t);
  document.querySelectorAll('.js-date').forEach(e=>e.textContent=e.dataset.mode==='long'?long:short);
}
(function init(){
  /* Gear: dipasang permanen + dipasang ulang berkala */
  const bindGear=()=>{
    const b=$('#btnSettings');
    if(b&&!b.dataset.bound){ b.dataset.bound='1'; b.onclick=openSettings; }
  };
  bindGear(); setInterval(bindGear,1500);
  $('#btnMenu').onclick=openSidebar;
  $('#overlay').onclick=closeSidebar;
  tickClock(); setInterval(tickClock,1000);
  seedIfEmpty();
  if(HEALED>0) toast('<b>Data master dipulihkan</b><small>'+HEALED+' data supir/tujuan dikembalikan otomatis.</small>',{type:'ok',icon:'database',dur:7000});
  initCloud();
  applyChrome();
  updateSyncBadge();
  render();
})();
</script>
